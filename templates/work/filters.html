<form method="get" class="filter-bar"><input type="hidden" name="view" value="{{ view|default:'list' }}">{% if request.GET.mine %}<input type="hidden" name="mine" value="1">{% endif %}{% if request.GET.overdue %}<input type="hidden" name="overdue" value="1">{% endif %}{% if request.GET.high %}<input type="hidden" name="high" value="1">{% endif %}<div class="search-field"><span>⌕</span><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="ค้นหางานหรือโปรเจกต์..." aria-label="ค้นหางาน"></div><select class="form-select" name="project" aria-label="กรองโปรเจกต์"><option value="">ทุกโปรเจกต์</option>{% for project in projects %}<option value="{{ project.pk }}" {% if request.GET.project == project.pk|stringformat:'s' %}selected{% endif %}>{{ project.title }}</option>{% endfor %}</select><select class="form-select" name="assignees" aria-label="กรองผู้รับผิดชอบ"><option value="">ผู้รับผิดชอบทั้งหมด</option>{% for person in people %}<option value="{{ person.pk }}" {% if request.GET.assignees == person.pk|stringformat:'s' %}selected{% endif %}>{{ person }}</option>{% endfor %}</select><select class="form-select" name="sales" aria-label="กรอง Sales"><option value="">Sales ทุกคน</option>{% for person in sales_people %}<option value="{{ person.pk }}" {% if request.GET.sales == person.pk|stringformat:'s' %}selected{% endif %}>{{ person }}</option>{% endfor %}</select><select class="form-select" name="engineer" aria-label="กรอง Engineer"><option value="">Engineer ทุกคน</option>{% for person in engineer_people %}<option value="{{ person.pk }}" {% if request.GET.engineer == person.pk|stringformat:'s' %}selected{% endif %}>{{ person }}</option>{% endfor %}</select><select class="form-select" name="status" aria-label="กรองสถานะ"><option value="">ทุกสถานะ</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select class="form-select" name="priority" aria-label="กรองความสำคัญ"><option value="">ทุกความสำคัญ</option>{% for value,label in priorities %}<option value="{{ value }}" {% if request.GET.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><details class="advanced-filters"><summary>ตัวกรองเพิ่มเติม</summary><div class="advanced-grid"><label>No.<input type="number" min="1" class="form-control" name="no" value="{{ request.GET.no }}"></label><label>Project Name<input class="form-control" name="project_name" value="{{ request.GET.project_name }}"></label><label>Task<input class="form-control" name="task_name" value="{{ request.GET.task_name }}"></label><label>Notes<input class="form-control" name="notes" value="{{ request.GET.notes }}"></label><label>Start Date จาก<input type="date" class="form-control" name="start_from" value="{{ request.GET.start_from }}"></label><label>ถึง<input type="date" class="form-control" name="start_to" value="{{ request.GET.start_to }}"></label><label>End Date จาก<input type="date" class="form-control" name="end_from" value="{{ request.GET.end_from }}"></label><label>ถึง<input type="date" class="form-control" name="end_to" value="{{ request.GET.end_to }}"></label><label>% Complete ต่ำสุด<input type="number" min="0" max="100" class="form-control" name="progress_min" value="{{ request.GET.progress_min }}"></label><label>สูงสุด<input type="number" min="0" max="100" class="form-control" name="progress_max" value="{{ request.GET.progress_max }}"></label></div></details><input type="hidden" name="sort" value="{{ request.GET.sort }}"><button class="btn btn-dark">ค้นหา</button><a href="{{ request.path }}" class="text-muted">ล้าง</a></form>
