{% if page.has_other_pages %}<nav class="pagination-bar" aria-label="แบ่งหน้า">{% if page.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="{% querystring page=page.previous_page_number %}">← ก่อนหน้า</a>{% endif %}<span>หน้า {{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn btn-outline-secondary btn-sm" href="{% querystring page=page.next_page_number %}">ถัดไป →</a>{% endif %}</nav>{% endif %}
